# Stage 3: PatchTST long-context tail-quantile model
config_file: "config.py"
var_to_predict: ["PM2.5"]
selected_region: "SySW"
forecast_method: "PatchTST_TailQuantile_PM25"
train_model: true
save_model: true
use_file: false
impute: true
decompose: false

additional_var_to_select: ["PM2.5", "PM10", "O3", "TEMP", "HUMID", "WSP", "WDR"]
internal_var_to_add: ["hour", "month", "day_of_week"]

model_parameters:
  n_inputs: 168
  n_outputs: 24
  extreme_quantiles: [0.50, 0.75, 0.90, 0.95, 0.99]
  extreme_percentile: 0.95
  extreme_weight: 5.0
  train_fraction: 0.70
  val_fraction: 0.15
  learning_rate: 0.0005
  patch_length: 12
  patch_stride: 6
  patch_d_model: 96
  patch_attention_heads: 4
  patch_transformer_blocks: 3
  patch_dropout: 0.15

run_parameters:
  n_epoch: 200
  batchsize: 32
  num_batches: 10

IMPUTATION_METHOD: "AQUISTIL"
save_imputed_data: true
model_base_path: "AI_Runs/Model_weights/Extreme_v3/PatchTST_TailQuantile"
model_version: "v3.0"
strict_version_check: true
prob_samples: 100
evaluation_metrics: ["MAE", "RMSE", "R2", "Pearson", "IOA"]
